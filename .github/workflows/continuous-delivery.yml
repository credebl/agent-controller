name: Continous Delivery

# On every version tag (v*), build the image natively on an AMD64 and an ARM64
# runner, smoke test each one, push per-architecture tags, and then publish one
# multi-arch manifest under the release tags and `latest`.
#
# Registry: GHCR (ghcr.io/<owner>/credo-controller), using the built-in GITHUB_TOKEN.

on:
  push:
    tags:
      - 'v*'

env:
  SERVICE: credo-controller
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/credo-controller

jobs:
  build:
    name: Build, test and push (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Extract Git Tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (${{ matrix.platform }}) for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.SERVICE }}:smoke-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test - native Askar library loads
        run: |
          docker run --rm --platform ${{ matrix.platform }} --entrypoint node \
            ${{ env.SERVICE }}:smoke-${{ matrix.arch }} \
            -e "const { askar } = require('@openwallet-foundation/askar-nodejs'); console.log('arch=' + process.arch, 'askar loaded, native call ok:', typeof askar.version())"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push per-architecture tags
        run: |
          set -euo pipefail
          src="${SERVICE}:smoke-${{ matrix.arch }}"
          target="${GHCR_IMAGE}:${TAG}-${{ matrix.arch }}"
          docker tag "${src}" "${target}"
          docker push "${target}"

  publish-manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository (tags only, to decide on latest)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Extract Git Tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          set -euo pipefail
          # Tags: v2.4.0 (as before) and 2.4.0 (without the v).
          # `latest` moves only when this is the highest stable (non pre-release) version tag.
          tags=(--tag "${GHCR_IMAGE}:${TAG}" --tag "${GHCR_IMAGE}:${TAG#v}")
          highest="$(git tag -l 'v*' | grep -Ev -- '-' | sort -V | tail -n1)"
          if [[ "${TAG}" != *-* && "${TAG}" == "${highest}" ]]; then
            tags+=(--tag "${GHCR_IMAGE}:latest")
          else
            echo "Not tagging latest: ${TAG} is a pre-release or not the highest version (${highest})"
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "${GHCR_IMAGE}:${TAG}-amd64" \
            "${GHCR_IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${TAG}"
