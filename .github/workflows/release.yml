name: Version Packages

# Opens or updates the "Version Packages" pull request from the changesets
# merged into main. Merging that pull request bumps the version and changelog.
# Nothing is published or tagged here: a maintainer pushes the vX.Y.Z tag, which
# starts the existing Continuous Delivery workflow.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version Packages pull request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node v20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Create or update the Version Packages pull request
        uses: changesets/action@66d7d1ddafddf1ef45f98ee51a7496f9cdadb2f4 # v2.1.2
        with:
          version: yarn version-packages
          title: 'chore: version packages'
          commit: |-
            chore: version packages

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
