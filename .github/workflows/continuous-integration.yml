name: Continuous Integration

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  # Cancel previous runs that are not completed yet
  group: agent-controller-${{ github.ref }}-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    name: Validate
    steps:
      - name: Checkout agent-controller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup node v20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # bun install reads yarn.lock (kept as the source of truth) and honours `resolutions`
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Apply patches
        run: bun run patch-package

      - name: Linting
        run: bun run lint

      - name: Prettier
        run: bun run check-format

      - name: Compile
        run: bun run check-types

      - name: Test
        run: bun run test
